[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dont-ask-again"
version = "0.1.0"
description = "Find secrets that AI coding agents saved into repo config (Claude Code 'don't ask again' approvals, MCP configs)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "azizimgh" }]
keywords = ["secrets", "security", "claude-code", "mcp", "ai-agents", "pre-commit", "gitleaks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/azizimgh/dont-ask-again"
Issues = "https://github.com/azizimgh/dont-ask-again/issues"

[project.scripts]
dont-ask-again = "dont_ask_again.cli:main"
daa = "dont_ask_again.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dont_ask_again = ["rules.toml"]

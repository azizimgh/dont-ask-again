name: release

# Push a tag like v0.1.0 to publish that version to PyPI and create a GitHub release.
# Publishing uses PyPI trusted publishing (OIDC): no API token is stored in this repo.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/dont_ask_again/__init__.py').read()).group(1))")
          echo "tag=$tag pyproject=$py __init__=$init"
          [ "$tag" = "$py" ] && [ "$tag" = "$init" ] || { echo "::error::tag v$tag does not match pyproject ($py) / __init__ ($init)"; exit 1; }

      - name: Test
        run: |
          python -m pip install --quiet .
          PYTHONPATH=tests python -m unittest discover -s tests

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dont-ask-again/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

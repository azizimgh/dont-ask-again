name: dont-ask-again
description: Find secrets that AI coding agents saved into repo config (Claude Code "don't ask again" approvals, MCP configs).
branding:
  icon: shield
  color: red

inputs:
  path:
    description: Directory to scan.
    default: "."
  history:
    description: Also scan git history (needs `fetch-depth 0` on actions/checkout).
    default: "false"
  fail-on:
    description: error, warn or never.
    default: "error"
  sarif:
    description: Upload results to GitHub code scanning (needs `security-events write` permission).
    default: "false"

outputs:
  exit-code:
    description: 0 clean, 1 findings at the fail-on level.
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dont-ask-again
      shell: bash
      run: python -m pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}

    - name: Scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_HISTORY: ${{ inputs.history }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SARIF: ${{ inputs.sarif }}
      run: |
        args=(scan "$INPUT_PATH" --fail-on "$INPUT_FAIL_ON")
        if [ "$INPUT_HISTORY" = "true" ]; then args+=(--history); fi
        set +e
        dont-ask-again "${args[@]}"
        code=$?
        if [ "$INPUT_SARIF" = "true" ]; then
          dont-ask-again "${args[@]}" --format sarif --output dont-ask-again.sarif --fail-on never
        fi
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: dont-ask-again.sarif
        category: dont-ask-again

    - name: Fail on findings
      if: steps.scan.outputs.exit-code != '0'
      shell: bash
      run: exit 1

# dont-ask-again rule pack.
#
# One rule = one table below + one test case in tests/cases.py.
# Regexes use Python `re` syntax. Use TOML literal strings ('...') so backslashes stay as typed.
#
# Three kinds of rule:
#
#   [[env]]    NAME=value, in commands and in JSON "env" blocks. `name` matches the variable name.
#
#   [[flag]]   a command-line flag that carries a secret. `flags` uses this notation:
#                "-p"           -p VALUE  or  -pVALUE
#                "-p..."        only -pVALUE           (mysql: `-p` alone prompts)
#                "--password"   --password VALUE  or  --password=VALUE
#                "--password="  only --password=VALUE
#              Optional: `requires` (a word that must follow the program, e.g. "login"),
#              `positional = N` (take the Nth plain argument, counted after `requires`),
#              `value` (regex the value must match; a named group `secret` marks the secret),
#              `programs = ["*"]` with `exclude_programs` for flags that apply to any program.
#
#   [[regex]]  matched anywhere in any string: headers, URLs, known token formats.
#              A named group `secret` marks the secret; without it the whole match is reported.
#              Rules are tried in file order, so put specific formats before generic ones.

# Values that are references or placeholders, not secrets. Searched case-insensitively.
[placeholders]
regex = [
  '^\$',                       # $VAR, ${VAR}, $(cmd)
  '\$\{',
  '\$\(',
  '^<[^>]*>$',                 # <password>
  '^\{\{.*\}\}$',              # {{ secret }}
  '^%[A-Za-z_]+%$',            # %PASSWORD%
  '^\*',                       # * wildcard in permission rules, ***
  '^x{3,}$',
  '^\.{3,}$',
  '^\d{1,5}$',                 # small numbers: MAX_TOKEN=4096
  '^(changeme|change_me|password|passw0rd|secret|token|example|sample|dummy|test|redacted|placeholder|none|null|true|false|yes|no|on|off)$',
  '^your[_-]?(password|pass|token|secret|key|api[_-]?key)',
  '^my[_-]?(password|pass|token|secret|key)$',
]

# -- env ---------------------------------------------------------------------------

[[env]]
id = "env-secret-literal"
description = "Literal secret assigned to an environment variable"
name = '''(?i)^(PGPASSWORD|MYSQL_PWD|REDISCLI_AUTH|PASSWORD|PASSWD|PASS|PWD|TOKEN|SECRET|API_?KEY|[A-Z0-9_]*_(PASSWORD|PASSWD|PASS|PWD|TOKEN|SECRET|API_?KEY|ACCESS_KEY|SECRET_KEY|PRIVATE_KEY|AUTH|CREDENTIALS?))$'''

# -- flags -------------------------------------------------------------------------

[[flag]]
id = "sshpass-password"
description = "Password passed to sshpass -p"
programs = ["sshpass"]
flags = ["-p"]

[[flag]]
id = "mysql-password"
description = "Password passed to a MySQL client (-pSECRET or --password=SECRET)"
programs = ["mysql", "mariadb", "mysqldump", "mysqladmin", "mysqlimport", "mysqlsh", "mariadb-dump"]
flags = ["-p...", "--password="]

[[flag]]
id = "redis-cli-password"
description = "Password passed to redis-cli -a / --pass"
programs = ["redis-cli", "valkey-cli"]
flags = ["-a", "--pass"]

[[flag]]
id = "registry-login-password"
description = "Password passed to a container registry login"
programs = ["docker", "podman", "nerdctl", "helm", "skopeo", "buildah", "oras", "crane"]
requires = ["login"]     # avoids `docker run -p 8080:80`
flags = ["-p", "--password"]

[[flag]]
id = "curl-user-password"
description = "user:password passed to curl -u"
programs = ["curl"]
flags = ["-u", "-U", "--user", "--proxy-user"]
value = '^[^:\s]+:(?P<secret>.+)$'

[[flag]]
id = "vault-login-token"
description = "Token passed to vault login"
programs = ["vault"]
requires = ["login"]
positional = 1
value = '^(?P<secret>[A-Za-z0-9._\-]{16,})$'

[[flag]]
id = "mongo-password"
description = "Password passed to a MongoDB client -p / --password"
programs = ["mongosh", "mongo", "mongodump", "mongorestore", "mongoexport", "mongoimport", "mongostat", "mongotop"]
flags = ["-p", "--password"]

[[flag]]
id = "sqlcmd-password"
description = "Password passed to sqlcmd / bcp -P"
programs = ["sqlcmd", "bcp"]
flags = ["-P"]

[[flag]]
id = "ldap-password"
description = "Bind password passed to an LDAP tool -w"
programs = ["ldapsearch", "ldapmodify", "ldapadd", "ldapdelete", "ldapwhoami", "ldappasswd", "ldapcompare", "ldapmodrdn"]
flags = ["-w"]

[[flag]]
id = "smbclient-password"
description = "user%password passed to smbclient -U"
programs = ["smbclient", "rpcclient", "smbcacls", "smbget"]
flags = ["-U", "--user"]
value = '^[^%\s]+%(?P<secret>.+)$'

[[flag]]
id = "openssl-pass"
description = "Literal pass:PASSWORD given to openssl"
programs = ["openssl"]
flags = ["-passin", "-passout", "-pass", "-password"]
value = '^pass:(?P<secret>.+)$'

[[flag]]
id = "az-login-password"
description = "Password or secret passed to az login -p"
programs = ["az"]
requires = ["login"]
flags = ["-p", "--password"]

[[flag]]
id = "doctl-token"
description = "Token passed to doctl auth init -t"
programs = ["doctl"]
flags = ["-t"]

[[flag]]
id = "curl-oauth2-bearer"
description = "Token passed to curl --oauth2-bearer"
programs = ["curl"]
flags = ["--oauth2-bearer"]

[[flag]]
id = "htpasswd-batch-password"
description = "Password passed to htpasswd -b (third argument: file user password)"
programs = ["htpasswd"]
positional = 3

[[flag]]
id = "rabbitmqctl-password"
description = "Password passed to rabbitmqctl add_user / change_password"
programs = ["rabbitmqctl"]
requires = ["add_user", "change_password"]
positional = 2

[[flag]]
id = "generic-secret-flag"
description = "Secret passed in a --password / --token style flag"
programs = ["*"]
exclude_programs = ["mysql", "mariadb", "mysqldump", "mysqladmin", "mysqlimport", "mysqlsh", "mariadb-dump"]
flags = ["--password", "--passwd", "--http-password", "--ftp-password", "--proxy-password", "--token", "--api-key", "--apikey", "--auth-token", "--access-token", "--client-secret", "--bearer-token"]

# -- regex: known token formats (specific first) -----------------------------------

[[regex]]
id = "private-key"
description = "Private key block"
regex = '-----BEGIN [A-Z ]*PRIVATE KEY-----'

[[regex]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '\bsk-ant-[A-Za-z0-9_\-]{20,}'

[[regex]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_\-]{20,}'

[[regex]]
id = "github-token"
description = "GitHub token"
regex = '\b(?:(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,})\b'

[[regex]]
id = "gitlab-token"
description = "GitLab personal access token"
regex = '\bglpat-[A-Za-z0-9_\-]{20,}'

[[regex]]
id = "npm-token"
description = "npm access token"
regex = '\bnpm_[A-Za-z0-9]{36}\b'

[[regex]]
id = "aws-access-key-id"
description = "AWS access key ID"
regex = '\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'

[[regex]]
id = "slack-token"
description = "Slack token"
regex = '\bxox[abposr]-[A-Za-z0-9\-]{10,}'

[[regex]]
id = "stripe-live-key"
description = "Stripe live secret key"
regex = '\b(?:sk|rk)_live_[A-Za-z0-9]{20,}'

[[regex]]
id = "google-api-key"
description = "Google API key"
regex = '\bAIza[0-9A-Za-z_\-]{35}\b'

[[regex]]
id = "vault-token"
description = "HashiCorp Vault token"
regex = '\bhv[sb]\.[A-Za-z0-9_\-]{20,}'

[[regex]]
id = "npm-auth-token"
description = "npm registry _authToken / _password"
regex = '''(?<![A-Za-z0-9])(?:_authToken|_auth|_password)\s*[=\s]\s*["']?(?P<secret>[^\s"']{8,})'''

# -- regex: headers and URLs -------------------------------------------------------

[[regex]]
id = "header-authorization"
description = "Credential in an HTTP Authorization header"
regex = '''(?i)\b(?:proxy-)?authorization\s*:\s*(?:bearer|basic|token|apikey|digest)\s+(?P<secret>[^\s"',;]+)'''

[[regex]]
id = "header-api-key"
description = "Credential in an API key header"
regex = '''(?i)\b(?:x-api-key|api-key|x-auth-token|x-access-token|private-token|x-goog-api-key)\s*:\s*(?P<secret>[^\s"',;]+)'''

[[regex]]
id = "url-credentials"
description = "Password inside a URL (scheme://user:password@host)"
regex = '''(?i)\b[a-z][a-z0-9+.\-]*://[^\s:/@?#'"]+:(?P<secret>[^\s@/?#'"]+)@'''

[[regex]]
id = "url-query-secret"
description = "Secret in a URL query parameter"
regex = '''(?i)[?&](?:api[_-]?key|access[_-]?token|auth[_-]?token|token|secret|password|passwd)=(?P<secret>[^&\s"'#]+)'''
